apiVersion: v1
kind: Service
metadata:
  name: node-eks
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: node-eks
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-eks
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /node-eks(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: node-eks
                port:
                  name: http